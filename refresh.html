<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Refreshing Vehicle Scorecard</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#edf5ff;font:16px system-ui,sans-serif}
    main{max-width:440px;padding:28px;text-align:center}
    .spinner{width:42px;height:42px;margin:0 auto 18px;border:4px solid #25384f;border-top-color:#1687ff;border-radius:50%;animation:spin .8s linear infinite}
    p{color:#9cacbf;line-height:1.5}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main><div class="spinner"></div><h1>Refreshing the app</h1><p>Saved vehicles are being preserved while the old app shell is replaced.</p></main>
  <script>
    (async()=>{
      try{
        if("serviceWorker" in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration=>registration.unregister()));
        }
        if("caches" in window){
          const keys=await caches.keys();
          await Promise.all(keys.filter(key=>key.startsWith("vehicle-scorecard")).map(key=>caches.delete(key)));
        }
      }finally{
        location.replace("./?refresh=1225-"+Date.now());
      }
    })();
  </script>
</body>
</html>
